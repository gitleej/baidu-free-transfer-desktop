name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build standalone executable
        shell: pwsh
        run: .\scripts\build.ps1 -PythonExe python
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiduFreeTransfer-Windows
          path: release/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release\BaiduFreeTransfer.exe release\SHA256SUMS.txt --generate-notes --title "Baidu Free Transfer $env:GITHUB_REF_NAME"
